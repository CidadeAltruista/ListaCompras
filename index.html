<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, minimum-scale=0.25">
  <title>Lista de Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Base da tabela (sem largura forçada: o <colgroup> manda) */
    #tabela table{
      table-layout: fixed;
      border-collapse: collapse;
    }
    #tabela th, #tabela td {
      border: 1px solid #4B5563;
      white-space: normal;
      word-break: break-word;
      padding: 4px 6px;
      vertical-align: top;
    }

    /* Sticky col. 1 e 2 */
    #tabela th:nth-child(1),
    #tabela td:nth-child(1){
      position: sticky; left: 0;
      background-color: #fff;
      z-index: 46;
      border-right: none;
      background-clip: padding-box;
      text-align: center;
    }
    :root { --col1: 12px; } /* tem de bater com a 1.ª coluna do <colgroup> */
    #tabela th:nth-child(2),
    #tabela td:nth-child(2){
      position: sticky; left: var(--col1);
      background-color: #fff;
      z-index: 45;
      border-left: 2px solid #374151 !important;
      background-clip: padding-box;
    }

    /* Linha de categoria */
    #tabela tr.categoria td{
      background:#fff !important;
      font-weight:700;
      text-align:left;
      border-top:1px solid #4B5563;
      border-bottom:1px solid #4B5563;
      font-size: .75rem;
      padding:.25rem .5rem;
      position:relative;
      z-index:10;
    }

    /* Bloco das propriedades “nome: qty” */
    #tabela .aloj-container{
      display: inline-block; /* abraça as 2 linhas renderizadas */
      max-width: 100%;
    }

    /* Sugestões do search */
    #suggestions{
      position:absolute;
      z-index:99999;
      left:0; width:100%;
      box-sizing:border-box;
      max-height:10rem;
      overflow:auto;
      background:#fff;
    }
    #suggestions:empty{ display:none; }

    /* Estado com animação opcional */
    #estado{ font-style:italic; }
    .estado-typing{ display:inline-block; white-space:nowrap; overflow:hidden; animation:none; }
    @keyframes estadoTyping{ from{ width:0ch; } to{ width: var(--estado-ch, 0ch); } }

    /* --------- COMPORTAMENTO DE EDIÇÃO --------- */

    /* Tabela esbatida por defeito; normal em Edição */
    #tabela { opacity: .65; transition: opacity .15s ease; }
    body.editing-on #tabela { opacity: 1; }

    /* Chips (propriedades) só clicáveis em Edição */
    #tabela .wrap-prop{
      opacity: .55;
      pointer-events: none;
      cursor: default;
      transition: opacity .12s ease;
    }
    body.editing-on #tabela .wrap-prop{
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }

    /* Mostrar a última coluna (❌) apenas em Edição */
    #tabela tr:not(.categoria) td:last-child{ display:none; }
    body.editing-on #tabela tr:not(.categoria) td:last-child{ display:table-cell; }
  </style>
</head>

<body class="bg-gray-100 text-gray-900 p-4 text-sm">
  <!-- Cabeçalho -->
  <header class="mb-3">
    <h1 class="text-sm font-semibold text-gray-700 tracking-wide uppercase mb-2">
      Lista de compras - Cidade Altruísta Lda
    </h1>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
      <button id="modoEdicao"
        class="w-full h-10 inline-flex items-center justify-center gap-1.5 px-3 text-xs font-medium text-white bg-emerald-600 rounded-md shadow-sm hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
        <span>Edição</span>
      </button>

      <button id="mostrarFaltas"
        class="w-full h-10 inline-flex items-center justify-center gap-1.5 px-3 text-xs font-medium text-white bg-red-600 rounded-md shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Em Falta</span>
      </button>

      <button id="mostrarComprados"
        class="w-full h-10 inline-flex items-center justify-center gap-1.5 px-3 text-xs font-medium text-white bg-amber-500 rounded-md shadow-sm hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Comprados</span>
      </button>

      <button id="mostrarTudo"
        class="w-full h-10 inline-flex items-center justify-center gap-1.5 px-3 text-xs font-medium text-white bg-gray-600 rounded-md shadow-sm hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <span>Tudo</span>
      </button>
    </div>
  </header>

  <!-- Pesquisa + estado -->
  <div class="mb-4 flex items-center gap-3">
    <div class="relative">
      <input id="searchInput" type="text" placeholder="Pesquisar artigo…"
             class="border-2 border-green-200 rounded-md px-2 py-1 w-60"/>
      <ul id="suggestions"
          class="absolute left-0 right-0 mt-1 max-h-40 overflow-auto shadow w-80 bg-white border rounded z-10 text-xs"></ul>
    </div>
    <em id="estado" class="text-xs text-gray-600 italic whitespace-nowrap"></em>
  </div>

  <!-- Tabela -->
  <div id="tabela"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
