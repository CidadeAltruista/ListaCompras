<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #f4f5f2;
      --panel: #ffffff;
      --ink: #17201b;
      --muted: #657066;
      --line: #d8ded6;
      --line-strong: #aeb9ad;
      --green: #16704a;
      --green-strong: #0f5d3c;
      --blue: #2d5f9a;
      --red: #c7352f;
      --amber: #c88317;
      --slate: #4f5b53;
      --col1: 24px;
      --col2: 112px;
      --props-col: 310px;
      --table-width: calc(var(--col1) + var(--col2) + var(--props-col));
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 12% -10%, rgba(22,112,74,.18), transparent 24rem),
        radial-gradient(circle at 92% 0%, rgba(45,95,154,.14), transparent 26rem),
        linear-gradient(180deg, rgba(255,255,255,.84), rgba(244,245,242,.96) 30rem),
        var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-shell {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 60;
      margin: -18px -18px 16px;
      padding: 14px 18px 12px;
      isolation: isolate;
      overflow: hidden;
      background:
        linear-gradient(rgba(244,245,242,.78), rgba(244,245,242,.82)),
        url("assets/header-pattern.png") center 42% / cover;
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(216,222,214,.9);
    }

    .app-header::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(255,255,255,.18);
    }

    .header-grid {
      display: block;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: baseline;
      justify-content: center;
    }

    .title-row h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2.25rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
    }

    #estado {
      position: fixed;
      top: 10px;
      left: 12px;
      z-index: 100;
      min-height: 0;
      color: var(--red);
      font-size: .78rem;
      font-weight: 750;
      font-style: italic;
      white-space: nowrap;
    }

    #estado.estado-ok { color: var(--green); }
    #estado.estado-busy { color: var(--red); }

    .status-pill {
      display: contents;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-items: center;
      justify-items: center;
      margin-top: 12px;
    }

    .search-wrap {
      position: relative;
      min-width: 0;
      width: min(var(--table-width), 100%);
    }

    #searchInput {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #fff;
      padding: 0 14px 0 38px;
      color: var(--ink);
      font-size: .95rem;
      outline: none;
      box-shadow: 0 1px 2px rgba(23,32,27,.04);
    }

    #searchInput:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(22,112,74,.14);
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      width: 16px;
      height: 16px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    #suggestions {
      position: absolute;
      z-index: 99999;
      left: 0;
      width: 100%;
      box-sizing: border-box;
      max-height: 14rem;
      overflow: auto;
      margin-top: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 45px rgba(23,32,27,.18);
    }

    #suggestions:empty { display: none; }
    #suggestions li { padding: 10px 12px; font-size: .85rem; }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(96px, auto));
      gap: 8px;
      justify-content: center;
      order: -1;
    }

    .action-button {
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 13px;
      color: #fff;
      font-size: .82rem;
      font-weight: 750;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(23,32,27,.12);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    .action-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(23,32,27,.14);
    }

    .action-button:focus {
      outline: 3px solid rgba(22,112,74,.2);
      outline-offset: 2px;
    }

    .action-button svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    .button-edit { background: var(--green); }
    .button-edit:hover { background: var(--green-strong); }
    .button-faltas { background: var(--red); }
    .button-comprados { background: var(--amber); }
    .button-tudo { background: var(--slate); }

    body.editing-on .button-edit {
      background: #111827;
    }

    .action-button.is-active {
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.55), 0 8px 20px rgba(23,32,27,.14);
    }

    .table-panel {
      width: max-content;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 20px 50px rgba(23,32,27,.08);
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 520px) {
      .table-panel {
        margin-left: -10px;
        margin-right: auto;
      }
    }

    .property-filters {
      width: max-content;
      max-width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 7px 10px;
      margin: 0 auto;
    }

    .property-filter {
      min-height: 28px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(255,255,255,.85);
      padding: 4px 10px;
      color: var(--slate);
      font-size: .72rem;
      font-weight: 800;
      cursor: pointer;
      transition: background .12s ease, border-color .12s ease, color .12s ease, transform .12s ease;
    }

    .property-filter:hover {
      transform: translateY(-1px);
      border-color: var(--green);
    }

    .property-filter.is-active {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }

    #tabela {
      width: 100%;
      overflow: auto;
      opacity: .9;
      transition: opacity .15s ease;
    }

    body.editing-on #tabela { opacity: 1; }

    #tabela table {
      width: max-content;
      min-width: 0;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
      background: #fff;
    }

    #tabela th,
    #tabela td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      white-space: normal;
      word-break: break-word;
      vertical-align: top;
    }

    #tabela td:last-child {
      border-right: 0;
    }

    #tabela td:first-child,
    #tabela td:first-child div {
      white-space: nowrap;
      word-break: normal;
      overflow-wrap: normal;
    }

    #tabela tr:not(.categoria) td {
      background: #fff;
      transition: background .12s ease;
    }

    #tabela tr:not(.categoria):hover td {
      background: #fbfcfa;
    }

    #tabela th:nth-child(1),
    #tabela td:nth-child(1) {
      position: sticky;
      left: 0;
      z-index: 46;
      background: #fff;
      text-align: center;
      background-clip: padding-box;
    }

    #tabela th:nth-child(2),
    #tabela td:nth-child(2) {
      position: sticky;
      left: var(--col1);
      z-index: 45;
      background: #fff;
      border-left: 1px solid var(--line-strong);
      background-clip: padding-box;
    }

    #tabela tr.categoria td {
      position: sticky;
      left: 0;
      z-index: 50;
      padding: 2px 8px;
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
      background: #eef2ec !important;
      color: #6b746b;
      font-size: .62rem;
      font-weight: 750;
      letter-spacing: .04em;
      line-height: 1.05;
      text-align: left;
      text-transform: uppercase;
    }

    #tabela .aloj-container {
      display: block;
      max-width: 100%;
    }

    #tabela .property-row {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    #tabela .property-row .wrap-prop {
      width: max-content;
      max-width: 100%;
      flex-wrap: nowrap;
      white-space: nowrap;
      word-break: normal;
      overflow-wrap: normal;
    }

    #tabela .wrap-prop > span {
      flex: 0 0 auto;
      white-space: nowrap;
      word-break: normal;
      overflow-wrap: normal;
    }

    #tabela .wrap-prop {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid transparent;
      border-radius: 999px;
      opacity: .74;
      pointer-events: none;
      cursor: default;
      transition: opacity .12s ease, transform .12s ease, border-color .12s ease;
    }

    #tabela .wrap-prop {
      min-height: 16px;
      line-height: 1.15;
    }

    body.editing-on #tabela .wrap-prop {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }

    body.editing-on #tabela .wrap-prop:hover {
      transform: translateY(-1px);
      border-color: rgba(23,32,27,.16);
    }

    #tabela col:last-child,
    #tabela tr:not(.categoria) td:last-child { display: none; }
    #tabela tr:not(.categoria) td:nth-last-child(2) { border-right: 0; }
    body.editing-on #tabela col:last-child,
    body.editing-on #tabela tr:not(.categoria) td:last-child { display: table-column; }
    body.editing-on #tabela tr:not(.categoria) td:last-child { display: table-cell; }
    body.editing-on #tabela tr:not(.categoria) td:nth-last-child(2) { border-right: 1px solid var(--line); }

    .estado-typing {
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
      animation: none;
    }

    @keyframes estadoTyping {
      from { width: 0ch; }
      to { width: var(--estado-ch, 0ch); }
    }

    @media (max-width: 620px) {
      :root {
      --col1: 24px;
      --col2: 104px;
      --props-col: 310px;
      --table-width: calc(var(--col1) + var(--col2) + var(--props-col));
      }

      .app-shell {
        padding: 10px;
      }

      .app-header {
        margin: -10px -10px 6px;
        padding: 7px 10px 8px;
      }

      .eyebrow { margin-bottom: 1px; }
      .title-row h1 { font-size: 1.4rem; }

      .toolbar {
        grid-template-columns: 1fr;
        gap: 6px;
        margin-top: 6px;
      }

      .actions {
        width: 100%;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
      }

      .action-button {
        width: 100%;
        height: 38px;
        padding: 0 3px;
        gap: 3px;
        font-size: .68rem;
      }

      .action-button svg { width: 14px; height: 14px; }
      #searchInput { height: 36px; }

      .property-filters { gap: 3px; min-height: 0; padding: 4px 3px; }
      .property-filter { min-height: 26px; padding: 3px 6px; font-size: .65rem; }

      .table-panel {
        width: calc(100% + 20px);
        max-width: none;
        border-radius: 0;
        margin: 0 auto 0 -10px;
        border-left: 0;
        border-right: 0;
      }

      #tabela {
        overflow: visible;
      }

      #tabela table {
        display: block;
        width: 100%;
      }

      #tabela colgroup { display: none; }
      #tabela tbody { display: block; }
      #tabela tr.categoria,
      #tabela tr.categoria td { display: block; width: 100%; }
      #tabela tr:not(.categoria) {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr) auto;
        border-bottom: 1px solid var(--line);
      }

      #tabela tr:not(.categoria) td {
        position: relative;
        left: auto;
        z-index: auto;
        border-bottom: 0;
      }

      #tabela tr:not(.categoria) td:nth-child(1),
      #tabela tr:not(.categoria) td:nth-child(2) { padding: 2px 4px !important; }

      #tabela tr:not(.categoria) td:nth-child(1) {
        display: flex;
        align-items: flex-start;
        grid-column: 1;
        grid-row: 1;
      }
      #tabela tr:not(.categoria) td:nth-child(1) > div:first-child:not(:empty):not(:last-child)::after {
        content: ' | ';
        color: var(--muted);
        font-weight: 400;
        white-space: pre;
      }
      #tabela tr:not(.categoria) td:nth-child(2) { grid-column: 2; grid-row: 1; }
      #tabela td[data-tipo="artigo"] .pencil-icon {
        top: 50%;
        right: 6px;
        line-height: 1;
        transform: translateY(-50%);
      }
      #tabela tr:not(.categoria) td:nth-child(3) {
        grid-column: 1 / -1;
        grid-row: 2;
        min-width: 0;
        padding: 2px 2px !important;
        border-top: 1px solid var(--line);
        border-right: 0;
      }
      body.editing-on #tabela tr:not(.categoria) td:last-child {
        display: block;
        grid-column: 3;
        grid-row: 1;
        min-width: 24px;
        padding: 2px 4px !important;
        font-size: 12px;
        line-height: 12px;
      }

      #tabela .property-row {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        column-gap: 0;
        row-gap: 1px;
        font-size: 9px;
      }

      #tabela .property-row .wrap-prop {
        padding-left: 1px;
        padding-right: 1px;
        min-height: 14px;
      }

      #tabela .property-row .wrap-prop > span + span {
        margin-left: 1px;
      }

      #tabela tr.categoria td {
        padding: 2px 8px;
      }
    }

    @media (max-width: 360px) {
      #tabela .property-row { font-size: 8px; }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-grid">
        <div>
          <p class="eyebrow">Cidade Altruísta Lda</p>
          <div class="title-row">
            <h1>Lista de compras</h1>
            <span class="status-pill"><em id="estado"></em></span>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <div class="actions" aria-label="Acoes da lista">
          <button id="modoEdicao" class="action-button button-edit" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.86 4.49 19.5 7.14M6 18h2.75L19.5 7.25a1.87 1.87 0 0 0 0-2.65 1.87 1.87 0 0 0-2.65 0L6 15.35V18z" />
            </svg>
            <span class="button-label">Edição</span>
          </button>

          <button id="mostrarFaltas" class="action-button button-faltas" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v5m0 4h.01M10.3 3.86 2.82 17a2 2 0 0 0 1.74 3h14.88a2 2 0 0 0 1.74-3L13.7 3.86a2 2 0 0 0-3.4 0z" />
            </svg>
            <span class="button-label">Em falta</span>
          </button>

          <button id="mostrarComprados" class="action-button button-comprados" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.5 11.5 15 16 9.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" />
            </svg>
            <span class="button-label">Comprados</span>
          </button>

          <button id="mostrarTudo" class="action-button button-tudo" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
            </svg>
            <span class="button-label">Tudo</span>
          </button>
        </div>

        <div class="search-wrap">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" />
          </svg>
          <input id="searchInput" type="text" placeholder="Pesquisar artigo">
          <ul id="suggestions"></ul>
        </div>
      </div>
    </header>

    <main class="table-panel">
      <section id="propertyFilters" class="property-filters" aria-label="Filtros por propriedade"></section>
      <div id="tabela"></div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
